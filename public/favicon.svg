<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Circle Radial Gradient -->
    <radialGradient id="favBgGrad" cx="50%" cy="45%" r="50%" fx="40%" fy="35%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Outer Rim Metallic Gradient -->
    <linearGradient id="favRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="25%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="75%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Metallic Facet Gradients -->
    <linearGradient id="favGoldFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <linearGradient id="favCyanFacet" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>

    <linearGradient id="favPurpleFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>

    <linearGradient id="favEmeraldFacet" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <linearGradient id="favRoseFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="60%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>

    <linearGradient id="favBlueFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="favSpecularGlint" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Base Circular Icon with Metallic Border -->
  <circle cx="256" cy="256" r="248" fill="url(#favRimGrad)"/>
  <circle cx="256" cy="256" r="236" fill="url(#favBgGrad)"/>
  <circle cx="256" cy="256" r="236" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2"/>

  <!-- 3D Geometric Isometric Emblem in Center -->
  <g id="favEmblem" transform="translate(256, 256) scale(1.18) translate(-256, -256)">
    <!-- Top Left Loop Ribbon -->
    <path d="M256 128 L336 174 L336 216 L256 170 Z" fill="url(#favCyanFacet)" opacity="0.95"/>
    <path d="M256 128 L176 174 L216 197 L256 174 Z" fill="url(#favBlueFacet)"/>
    <path d="M176 174 L176 256 L216 233 L216 197 Z" fill="url(#favPurpleFacet)"/>

    <!-- Center Fold Overlap -->
    <path d="M216 233 L256 256 L296 233 L256 210 Z" fill="url(#favGoldFacet)"/>
    <path d="M256 210 L336 164 L296 141 L216 187 Z" fill="url(#favRoseFacet)" opacity="0.9"/>

    <!-- Bottom Right Loop Ribbon -->
    <path d="M256 384 L176 338 L176 296 L256 342 Z" fill="url(#favEmeraldFacet)" opacity="0.95"/>
    <path d="M256 384 L336 338 L296 315 L256 338 Z" fill="url(#favGoldFacet)"/>
    <path d="M336 338 L336 256 L296 279 L296 315 Z" fill="url(#favCyanFacet)"/>

    <!-- Interlocking Center Facets for 3D depth -->
    <path d="M256 256 L296 279 L336 256 L296 233 Z" fill="url(#favPurpleFacet)"/>
    <path d="M256 256 L216 279 L176 256 L216 233 Z" fill="url(#favBlueFacet)"/>
    <path d="M216 279 L256 302 L296 279 L256 256 Z" fill="url(#favRoseFacet)"/>

    <!-- High Gloss Specular Sheen Overlays -->
    <path d="M256 128 L336 174 L296 197 L216 151 Z" fill="url(#favSpecularGlint)" opacity="0.75"/>
    <path d="M176 174 L216 197 L216 279 L176 256 Z" fill="url(#favSpecularGlint)" opacity="0.35"/>
    <path d="M256 342 L336 296 L336 338 L256 384 Z" fill="url(#favSpecularGlint)" opacity="0.5"/>
  </g>
</svg>
